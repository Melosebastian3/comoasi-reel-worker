# Deletes the Buffer posts listed in publish/delete/request.json. Runs only when that file changes.
name: Delete Buffer posts

on:
  push:
    paths: ['publish/delete/request.json']

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Delete the listed posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node publish/buffer-delete.js publish/delete/request.json
