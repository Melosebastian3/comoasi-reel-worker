# One-off probe: the full narration path with the cloned devil voice (feat/devil-voice-clone),
# on CPU, the way kaggle/kernel.py installs it. Read-only, no secrets, no publishing.
name: TTS probe
on:
  push:
    branches: [ops/tts-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/devil-voice-clone
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && npm ci --omit=dev --no-audit --no-fund
      - name: Voice environment as on Kaggle
        run: |
          pip install -q uv && uv venv -q -p 3.11 /tmp/voice && uv pip install -q -p /tmp/voice/bin/python chatterbox-tts
          mkdir -p out && /tmp/voice/bin/python scripts/voice_server.py --check out/check.wav
          (/tmp/voice/bin/python scripts/voice_server.py > out/voice-server.log 2>&1 &) && sleep 5 && curl -sf http://127.0.0.1:7870/
      - name: Narration through render.js
        env:
          TTS_BACKEND: chatterbox
        run: |
          cat > narrate.mjs <<'JS'
          import { createNarrationAudio } from './render.js';
          const scenes = [
            { narration: 'Lizy Tagliani entró a MasterChef a cocinar y terminó cocinando a Luck Ra.', delivery: 'golpe' },
            { narration: 'Tan incondicional no era, dijo, y el estudio se quedó más frío que el postre.', delivery: 'veneno' },
            { narration: 'Moraleja: en la tele, el plato más picante siempre es el chisme.', delivery: 'remate' },
          ];
          const file = await createNarrationAudio(process.cwd() + '/out', scenes, 'es-MX-JorgeNeural', 'actualidad');
          console.log('narration', file);
          JS
          time node narrate.mjs
          ffmpeg -v error -y -i out/voice.mp3 -b:a 128k out/narracion-diablo.mp3 && rm -f out/voice-block-* out/voice.mp3
      - if: always()
        run: |
          ls -la out; tail -20 out/voice-server.log || true
          cd out && git init -q && git checkout -q -b tts-probe-out && git add . && git -c user.name=gha -c user.email=gha@users.noreply.github.com commit -qm "voice probe" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tts-probe-out
