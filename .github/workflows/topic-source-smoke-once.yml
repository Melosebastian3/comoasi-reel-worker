name: Como Asi live-source topic smoke once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic-source-smoke-once.yml'

permissions:
  contents: read

jobs:
  topic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate current-source automatic topic selector
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
            -H 'content-type: application/json' \
            --data '{"category":"famosos","memory":[],"learning":[]}' \
            'https://api-v2.appdeploy.ai/app/como-asi-studio-jjokns/api/engine/topic' > /tmp/topic.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/topic.json'))
          print(json.dumps(d, ensure_ascii=False, indent=2))
          assert d.get('topic'), d
          assert d.get('title'), d
          assert d.get('trendReason'), d
          sources=d.get('sources') or []
          assert len(sources) >= 1, d
          for source in sources:
              assert source.get('title') and source.get('url') and source.get('source'), source
          print('live-source-topic-selector-ok', d.get('topic'))
          PY
