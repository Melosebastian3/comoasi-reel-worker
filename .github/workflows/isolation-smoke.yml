name: Como Asi isolation smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check worker health and dedicated Neon database
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            'https://comoasi-reel-worker-production-4de5.up.railway.app/health' > /tmp/health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True, data
          assert data.get('project') == 'como-asi', data
          assert data.get('isolated') is True, data
          assert data.get('database') == 'comoasi', data
          assert data.get('role') == 'comoasi_app', data
          print('worker-health-ok')
          PY

      - name: Check strict isolation contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            'https://comoasi-reel-worker-production-4de5.up.railway.app/isolation' > /tmp/isolation.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/isolation.json'))
          assert data.get('project') == 'como-asi', data
          assert data.get('strictIsolation') is True, data
          for key in ('sharesHistyraDatabase','sharesHistyraWorker','sharesHistyraRepo','sharesHistyraStorage'):
              assert data.get(key) is False, (key, data)
          print('isolation-contract-ok')
          PY

      - name: Check Worker to Studio transport
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            'https://comoasi-reel-worker-production-4de5.up.railway.app/studio-health' > /tmp/studio-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/studio-health.json'))
          assert data.get('ok') is True, data
          assert data.get('project') == 'como-asi', data
          assert data.get('transport') == 'appdeploy-api-v2', data
          studio=data.get('studio') or {}
          assert studio.get('ok') is True, data
          assert studio.get('project') == 'como-asi', data
          assert studio.get('engine') == 'studio', data
          assert studio.get('fallback') is False, data
          print('worker-to-studio-ok')
          PY
