name: Como Asi one-time pipeline E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pipeline-e2e-once.yml'

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Generate and wait for first isolated Reel
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://comoasi-reel-worker-production-4de5.up.railway.app'
          cat > /tmp/payload.json <<'JSON'
          {
            "category": "bizarro",
            "topic": "Whittier, Alaska: la ciudad donde casi todos viven bajo un mismo techo",
            "title": "WHITTIER: LA CIUDAD BAJO UN MISMO TECHO",
            "angle": "Cómo un antiguo complejo militar terminó concentrando gran parte de la vida cotidiana de Whittier en un solo edificio",
            "protagonist": "Whittier, Alaska",
            "eventKey": "whittier-begich-towers",
            "subtopic": "lugares-bizarros",
            "periodLabel": "actualidad",
            "narrativeQuestion": "¿Cómo funciona una ciudad cuando gran parte de sus vecinos comparte el mismo edificio?"
          }
          JSON

          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json \
            "$BASE/api/generate" > /tmp/start.json

          cat /tmp/start.json
          JOB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/start.json'))
          job=data.get('jobId') or data.get('id')
          assert job, data
          print(job)
          PY
          )
          echo "JOB_ID=$JOB_ID"

          for i in $(seq 1 120); do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              "$BASE/api/jobs/$JOB_ID" > /tmp/job.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/job.json'))
          print('status=', d.get('status'), 'stage=', d.get('stage'), 'progress=', d.get('progress'), 'reel=', d.get('reel_id'))
          PY
            STATUS=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/job.json')).get('status',''))
          PY
            )
            if [ "$STATUS" = 'completed' ]; then
              cat /tmp/job.json
              python3 - <<'PY'
          import json
          d=json.load(open('/tmp/job.json'))
          assert d.get('status') == 'completed', d
          assert d.get('reel_status') == 'ready', d
          assert d.get('video_object_key'), d
          assert d.get('reel_id'), d
          result=d.get('result') or {}
          assert result.get('publishingKit'), d
          print('PIPELINE_E2E_OK', d.get('reel_id'), d.get('video_object_key'))
          PY
              exit 0
            fi
            if [ "$STATUS" = 'failed' ]; then
              cat /tmp/job.json
              exit 1
            fi
            sleep 12
          done

          echo 'Timed out waiting for pipeline' >&2
          cat /tmp/job.json >&2
          exit 1
