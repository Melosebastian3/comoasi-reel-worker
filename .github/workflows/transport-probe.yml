name: Studio transport probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify AppDeploy backend transport
        shell: bash
        run: |
          set -euo pipefail
          API_BASE='https://api-v2.appdeploy.ai/app/como-asi-studio-jjokns'
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "$API_BASE/api/_healthcheck" -o /tmp/health.json
          cat /tmp/health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('message') == 'Success', data
          assert data.get('project') == 'como-asi', data
          print('appdeploy-api-transport-ok')
          PY
